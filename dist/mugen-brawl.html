          const wd = 120 - k * 30, y = base - 30 - k * 40;
          ctx.fillRect(x - wd / 2 + 15, y, wd - 30, 30);
          ctx.beginPath();
          ctx.moveTo(x - wd / 2 - 10, y + 2); ctx.lineTo(x + wd / 2 + 10, y + 2);
          ctx.lineTo(x + wd / 2 - 15, y - 14); ctx.lineTo(x - wd / 2 + 15, y - 14);
          ctx.closePath(); ctx.fill();
        }
      });
      repeat(camX, 1, 520, 120, (x) => {
        seg(ctx, [x - 40, FLOOR_Y + 4, x - 40, FLOOR_Y - 120], 9, '#c0392b');
        seg(ctx, [x + 40, FLOOR_Y + 4, x + 40, FLOOR_Y - 120], 9, '#c0392b');
        seg(ctx, [x - 62, FLOOR_Y - 120, x + 62, FLOOR_Y - 120], 11, '#2a1a16');
        seg(ctx, [x - 52, FLOOR_Y - 100, x + 52, FLOOR_Y - 100], 7, '#c0392b');
      });
      groundBase(ctx, camX, '#c9b292', '#9e8668', '#7d6a52');
      repeat(camX, 1, 64, 40, (x) => {
        ctx.strokeStyle = 'rgba(90,70,50,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, FLOOR_Y); ctx.lineTo(x - 30, VIEW_H); ctx.stroke();
      });
    },
  },

  ice: {
    name: 'Geleira',
    draw(ctx, camX, t) {
      skyGrad(ctx, '#a9d6ef', '#f0faff');
      ridge(ctx, camX, 0.1, 210, 90, 0.006, 3, '#e8f4fb');
      ridge(ctx, camX, 0.1, 230, 60, 0.006, 3.3, '#bcd8ea');
      repeat(camX, 0.45, 80, 80, (x, i) => {
        const hgt = 60 + hash(i + 4) * 50;
        ctx.fillStyle = '#2f5d58';
        for (let k = 0; k < 3; k++) {
          const y = FLOOR_Y - k * hgt * 0.28, wd = 30 - k * 7;
          ctx.beginPath(); ctx.moveTo(x - wd, y); ctx.lineTo(x, y - hgt * 0.45); ctx.lineTo(x + wd, y); ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(x - 7, FLOOR_Y - hgt * 0.75); ctx.lineTo(x, FLOOR_Y - hgt * 0.9 - 6); ctx.lineTo(x + 7, FLOOR_Y - hgt * 0.75); ctx.closePath(); ctx.fill();
      });
      groundBase(ctx, camX, '#f2f8fc', '#cfe2ef', '#a9c7dc');
      repeat(camX, 1, 300, 100, (x, i) => {
        ctx.fillStyle = 'rgba(150,205,240,0.45)';
        ctx.beginPath(); ctx.ellipse(x, FLOOR_Y + 60 + hash(i) * 120, 70, 12, 0, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 0; i < 60; i++) {
        const sx = ((hash(i) * VIEW_W + t * (0.4 + hash(i + 1)) - camX * 0.6) % VIEW_W + VIEW_W) % VIEW_W;
        const sy = (hash(i + 2) * VIEW_H + t * (0.8 + hash(i + 3) * 0.8)) % VIEW_H;
        ctx.fillRect(sx, sy, 2.5, 2.5);
      }
    },
  },

  volcano: {
    name: 'Cratera do Vulcão',
    draw(ctx, camX, t) {
      skyGrad(ctx, '#1d0b0b', '#9c2f1a');
      const vx = 480 - camX * 0.08;
      ctx.fillStyle = '#2a1512';
      ctx.beginPath(); ctx.moveTo(vx - 300, FLOOR_Y); ctx.lineTo(vx - 50, 110); ctx.lineTo(vx + 50, 110); ctx.lineTo(vx + 300, FLOOR_Y); ctx.closePath(); ctx.fill();
      const glow = 0.6 + Math.sin(t * 0.05) * 0.2;
      ctx.fillStyle = `rgba(255,120,40,${glow})`;
      ctx.beginPath(); ctx.ellipse(vx, 112, 50, 8, 0, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = `rgba(60,40,40,${0.35 - i * 0.06})`;
        dot(ctx, vx + Math.sin(t * 0.01 + i) * 30 + i * 15, 90 - i * 22 - (t * 0.2 % 20), 26 + i * 10, ctx.fillStyle);
      }
      ridge(ctx, camX, 0.3, 255, 35, 0.012, 5, '#3a1c16');
      groundBase(ctx, camX, '#3d2a25', '#221613', '#150d0b');
      repeat(camX, 1, 170, 80, (x, i) => {
        const pulse = 0.55 + Math.sin(t * 0.06 + i) * 0.3;
        ctx.strokeStyle = `rgba(255,110,30,${pulse})`;
        ctx.lineWidth = 3;
        const y0 = FLOOR_Y + 40 + hash(i) * 150;
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + 30, y0 + 8); ctx.lineTo(x + 50, y0 + 2); ctx.lineTo(x + 80, y0 + 12); ctx.stroke();
      });
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 30; i++) {
        const sx = ((hash(i + 40) * VIEW_W - camX * 0.7 + Math.sin(t * 0.02 + i) * 20) % VIEW_W + VIEW_W) % VIEW_W;
        const sy = VIEW_H - ((hash(i + 41) * VIEW_H + t * (0.6 + hash(i) * 0.8)) % VIEW_H);
        ctx.fillStyle = 'rgba(255,140,50,0.7)';
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    },
  },
};

const BG_KEYS = Object.keys(BACKGROUNDS);

// Modo história: 5 fases, cada uma com 3 trechos de inimigos. '!' marca o chefe.
const STORY = [
  { name: 'Floresta Sombria', bg: 'forest', phases: [['bandit', 'bandit'], ['bandit', 'bandit', 'bandit'], ['bandit', 'brute', 'bandit', '!sombra']] },
  { name: 'Porto ao Entardecer', bg: 'city', phases: [['bandit', 'bandit', 'bandit'], ['brute', 'bandit', 'bandit'], ['bandit', 'brute', 'bandit', '!rocha']] },
  { name: 'Templo da Montanha', bg: 'temple', phases: [['bandit', 'bandit', 'brute', 'bandit'], ['bandit', 'bandit', 'bandit', 'bandit'], ['brute', 'bandit', '!trovao']] },
  { name: 'Geleira Eterna', bg: 'ice', phases: [['bandit', 'brute', 'bandit', 'bandit'], ['brute', 'brute', 'bandit'], ['bandit', 'bandit', '!neve']] },
  { name: 'Cratera do Vulcão', bg: 'volcano', phases: [['bandit', 'bandit', 'bandit', 'brute'], ['brute', 'brute', 'bandit', 'bandit'], ['!brasa', '!kai']] },
];

// ---- js/game.js ----
'use strict';
// Mundo da luta (entidades, colisões, câmera, HUD) e os modos de jogo.

class World {
  constructor(opt) {
    this.bg = BACKGROUNDS[opt.bg] || BACKGROUNDS.forest;
    this.stageW = opt.stageW || 1400;
    this.demo = !!opt.demo;
    this.dropItems = opt.dropItems !== false;
    this.fighters = []; this.projectiles = []; this.items = []; this.particles = [];
    this.cam = { x: 0 };
    this.camMin = 0; this.camMax = this.stageW - VIEW_W;
    this.bounds = { min: 20, max: this.stageW - 20 };
    this.frame = 0; this.shake = 0; this.flash = 0;
    this.banner = null; this.paused = false; this.pauseSel = 0; this.over = false;
    this.itemTimer = randi(500, 800);
    this.modeCtl = null;
  }

  setMode(m) { this.modeCtl = m; m.init(this); this.snapCamera(); }

  addFighter(key, o = {}) {
    const f = new Fighter(this, key, o);
    if (o.ai !== undefined && o.ai !== null) f.ai = new AIBrain(f, o.ai);
    this.fighters.push(f);
    return f;
  }

  spawnProjectile(owner, kind, o) {
    const p = new Projectile(this, owner, kind, o);
    this.projectiles.push(p);
    return p;
  }

  spawnItem(kind, x, z, y = 0) {
    const it = new Item(kind, x, z, y);
    this.items.push(it);
    return it;
  }

  randomItem(fromSky = true) {
    const r = Math.random();
    const kind = r < 0.3 ? 'bat' : r < 0.52 ? 'stone' : r < 0.78 ? 'milk' : 'juice';
    const lo = Math.max(this.bounds.min + 40, this.cam.x + 100), hi = Math.min(this.bounds.max - 40, this.cam.x + VIEW_W - 100);
    this.spawnItem(kind, rand(lo, Math.max(lo, hi)), rand(20, DEPTH - 20), fromSky ? 420 : 0);
  }

  nearestEnemy(f, visibleOnly) {
    let best = null, bd = 1e9;
    for (const g of this.fighters) {
      if (g === f || g.dead || g.gone || g.team === f.team) continue;
      if (visibleOnly && g.invisible > 0) continue;
      const d = Math.abs(g.x - f.x) + Math.abs(g.z - f.z) * 1.5 + (g.state === 'lying' ? 200 : 0);
      if (d < bd) { bd = d; best = g; }
    }
    return best;
  }

  fx(kind, x, y, z, o) { spawnFx(this, kind, x, y, z, o); }

  onDeath(f) {
    this.fx('text', f.x, f.y + f.height + 20, f.z, { text: 'K.O.', color: '#ffd84a', size: 26, life: 60 });
    if (this.modeCtl && this.modeCtl.onDeath) this.modeCtl.onDeath(this, f);
  }

  setBanner(title, sub = '', life = 120, color = '#ffd84a') {
    this.banner = { title, sub, life, t: 0, color };
  }

  // ---- atualização ----

  update() {
    if (this.paused) { this.updatePause(); return; }
    if (!this.demo && Keys.hit(['Escape', 'KeyP', 'T_pause'])) {
      this.paused = true; this.pauseSel = 0;
      Sound.play('menu');
      return;
    }
    this.frame++;
    for (const f of this.fighters) {
      if (this.over) clearInput(f.input);
      else if (f.player >= 0) readPlayer(f.player, f.input);
      else if (f.ai) f.ai.update(this);
    }
    for (const f of this.fighters) f.update();
    this.resolveMelee();
    for (const p of this.projectiles) p.update();
    this.resolveProjectiles();
    for (const it of this.items) it.update(this);
    this.resolveItems();
    for (const pa of this.particles) pa.update();

    this.projectiles = this.projectiles.filter((p) => !p.dead);
    this.items = this.items.filter((i) => !i.dead);
    this.particles = this.particles.filter((p) => !p.dead);
    if (this.particles.length > 600) this.particles.splice(0, this.particles.length - 600);
    this.fighters = this.fighters.filter((f) => !f.gone);

    if (this.dropItems && !this.over && --this.itemTimer <= 0) {
      if (this.items.filter((i) => !i.holder).length < 5) this.randomItem();
      this.itemTimer = randi(900, 1500);
    }
    if (this.modeCtl) this.modeCtl.update(this);
    this.updateCamera();
    if (this.shake > 0) { this.shake *= 0.85; if (this.shake < 0.5) this.shake = 0; }
    if (this.flash > 0) this.flash--;
    if (this.banner && ++this.banner.t > this.banner.life) this.banner = null;
  }

  updatePause() {
    if (anyMenu('up') || anyMenu('down')) { this.pauseSel = 1 - this.pauseSel; Sound.play('menu'); }
    if (Keys.hit(['Escape', 'KeyP', 'T_pause'])) { this.paused = false; return; }
    if (anyMenu('attack')) {
      Sound.play('select');
      if (this.pauseSel === 0) this.paused = false;
      else Game.toTitle();
    }
  }

  resolveMelee() {
    for (const f of this.fighters) {
      if (f.state !== 'move' || !f.move.hit) continue;
      const h = f.move.hit, t = f.moveT;
      if (t < h.from || t > h.to) continue;
      const s = f.size;
      let x1, x2;
      if (h.both) {
        x1 = f.x - h.w * s; x2 = f.x + h.w * s;
      } else {
        const a = f.x + f.facing * h.x * s, b = f.x + f.facing * (h.x + h.w) * s;
        x1 = Math.min(a, b); x2 = Math.max(a, b);
      }
      const y1 = f.y + (h.y - h.h / 2) * s, y2 = f.y + (h.y + h.h / 2) * s, zr = h.z || 15;
      for (const g of this.fighters) {
        if (g === f || g.team === f.team || g.dead) continue;
        if (g.hitLog.get(f.id) === f.swing) continue;
        if (Math.abs(g.z - f.z) > zr) continue;
        const gs = g.size, gx1 = g.x - 15 * gs, gx2 = g.x + 15 * gs, gy1 = g.y, gy2 = g.y + g.height;
        if (x2 < gx1 || x1 > gx2 || y2 < gy1 || y1 > gy2) continue;
        g.hitLog.set(f.id, f.swing);
        const dir = h.both ? sign(g.x - f.x) : f.facing;
        const res = g.receiveHit(h, f, dir);
        if (!res) continue;
        const hs = h.heavy ? 7 : 4;
        f.hitstop = Math.max(f.hitstop, res === 'block' ? 3 : hs);
        if (res === 'hit') {
          g.hitstop = Math.max(g.hitstop, hs);
          this.fx(h.heavy ? 'heavy' : 'spark', g.x - dir * 8 * gs, clamp((y1 + y2) / 2, gy1 + 10, gy2 - 10), g.z + 1);
          Sound.play(h.heavy ? 'heavy' : 'hit');
          if (h.heavy) this.shake = Math.max(this.shake, 5);
          f.mp = Math.min(f.maxMp, f.mp + 1.5);
        }
        if (f.move && f.move.weapon && f.holding && --f.holding.dur <= 0) f.holding.shatter(this);
      }
    }
  }

  resolveProjectiles() {
    const P = this.projectiles;
    // projéteis de times diferentes se anulam
    for (let i = 0; i < P.length; i++) {
      const a = P[i];
      if (a.dead || !a.d.solid || a.delay > 0) continue;
      for (let j = i + 1; j < P.length; j++) {
        const b = P[j];
        if (b.dead || !b.d.solid || b.team === a.team || b.delay > 0) continue;
        if (Math.abs(a.x - b.x) < a.r + b.r && Math.abs(a.z - b.z) < 16 && Math.abs(a.y - b.y) < 24) {
          a.explode(); b.explode();
          break;
        }
      }
    }
    for (const p of P) {
      if (p.dead || !p.active()) continue;
      const [py1, py2] = p.box();
      for (const g of this.fighters) {
        if (g.team === p.team || g.dead || p.hitSet.has(g.id)) continue;
        if (Math.abs(g.z - p.z) > (p.d.ground ? 20 : 14)) continue;
        if (Math.abs(g.x - p.x) > p.r + 14 * g.size) continue;
        if (py2 < g.y || py1 > g.y + g.height) continue;
        p.hitSet.add(g.id);
        const dir = p.vx ? sign(p.vx) : sign(g.x - p.x);
        const res = g.receiveHit(p.hit, p.owner, dir);
        if (!res) continue;
        if (res === 'hit') {
          g.hitstop = Math.max(g.hitstop, p.hit.heavy ? 6 : 3);
          Sound.play(p.hit.heavy ? 'heavy' : 'hit');
          if (p.hit.heavy) this.shake = Math.max(this.shake, 4);
        }
        if (!p.d.pierce) { p.explode(); break; }
      }
    }
  }

  resolveItems() {
    for (const it of this.items) {
      if (!it.thrown || it.dead) continue;
      for (const g of this.fighters) {
        if (g.team === it.team || g.dead || it.hitSet.has(g.id)) continue;
        if (Math.abs(g.z - it.z) > 16 || Math.abs(g.x - it.x) > 18 * g.size + 8) continue;
        if (it.y > g.y + g.height || it.y + 10 < g.y) continue;
        it.hitSet.add(g.id);
        const res = g.receiveHit(ITEM_DEFS[it.kind].throwHit, it.thrower, sign(it.vx));
        if (!res) continue;
        this.fx('heavy', it.x, it.y, it.z + 1);
        Sound.play('heavy');
        it.vx = -it.vx * 0.25; it.vy = 4; it.thrown = false;
        it.dur -= 3;
        if (it.dur <= 0) it.shatter(this);
        break;
      }
    }
  }

  snapCamera() {
    this.updateCamera();
    this.cam.x = this.camTarget();
  }

  camTarget() {
    let focus = this.fighters.filter((f) => f.player >= 0 && !f.dead);
    if (!focus.length) focus = this.fighters.filter((f) => f.player >= 0);
    if (!focus.length) focus = this.fighters.filter((f) => !f.dead);
    if (!focus.length) return this.cam.x;
    const avg = focus.reduce((s, f) => s + f.x, 0) / focus.length;
    return clamp(avg - VIEW_W / 2, this.camMin, Math.max(this.camMin, this.camMax));
  }

  updateCamera() {
    this.cam.x += (this.camTarget() - this.cam.x) * 0.12;
  }

  // ---- desenho ----

  draw(ctx) {
    ctx.save();
    if (this.shake > 0) ctx.translate(rand(-this.shake, this.shake), rand(-this.shake, this.shake) * 0.6);
    const cam = { x: Math.round(this.cam.x) };
    this.bg.draw(ctx, cam.x, this.frame);

    // sombras
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    for (const f of this.fighters) {
      const k = 1 - Math.min(f.y, 240) / 400, r = 20 * f.size * k;
      ctx.globalAlpha = f.invisible > 0 ? 0.2 : 1;
      ctx.beginPath(); ctx.ellipse(f.x - cam.x, FLOOR_Y + f.z, r, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const it of this.items) {
      if (it.holder) continue;
      ctx.beginPath(); ctx.ellipse(it.x - cam.x, FLOOR_Y + it.z, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of this.projectiles) {
      if (p.d.ground || p.delay > 0) continue;
      ctx.beginPath(); ctx.ellipse(p.x - cam.x, FLOOR_Y + p.z, p.r, p.r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }

    for (const pa of this.particles) if (pa.layer === 0) pa.draw(ctx, cam);
    const ents = [];
    for (const f of this.fighters) ents.push(f);
    for (const it of this.items) if (!it.holder) ents.push(it);
    for (const p of this.projectiles) ents.push(p);
    ents.sort((a, b) => a.z - b.z || a.y - b.y);
    for (const e of ents) e.draw(ctx, cam);
    for (const pa of this.particles) if (pa.layer !== 0) pa.draw(ctx, cam);
    ctx.restore();

    if (this.flash > 0) {
      ctx.fillStyle = `rgba(255,250,220,${this.flash / 10})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    if (this.demo) return;
    this.drawTags(ctx, cam);
    drawHUD(ctx, this);
    if (this.modeCtl && this.modeCtl.drawOverlay) this.modeCtl.drawOverlay(ctx, this);
    if (this.banner) drawBanner(ctx, this.banner);
    if (this.paused) drawPause(ctx, this);
  }

  drawTags(ctx, cam) {
    for (const f of this.fighters) {
      if (f.dead || f.invisible > 0) continue;
      let label = null, color = null;
      if (f.player >= 0) { label = `${f.player + 1}P`; color = PLAYER_COLORS[f.player]; }
      else if (f.boss) { label = 'CHEFE'; color = '#ffd84a'; }
      if (!label) continue;
      const sx = f.x - cam.x, sy = FLOOR_Y + f.z - f.y - f.height - 30;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(sx - 5, sy + 6); ctx.lineTo(sx + 5, sy + 6); ctx.lineTo(sx, sy + 12); ctx.closePath(); ctx.fill();
      txt(ctx, label, sx, sy + 2, { size: 13, font: FONT_DISPLAY, align: 'center', color, stroke: '#14121c', strokeW: 3 });
    }
  }

  hudList() {
    const h = this.fighters.filter((f) => f.player >= 0).sort((a, b) => a.player - b.player);
    const o = this.fighters.filter((f) => f.player < 0).sort((a, b) => (a.dead - b.dead) || (b.boss - a.boss) || (a.id - b.id));
    return h.concat(o).slice(0, 8);
  }
}

// ---- HUD ----

function drawHUD(ctx, w) {
  const list = w.hudList();
  if (!list.length) return;
  const PW = 234, PH = 40, rows = Math.ceil(list.length / 4);
  ctx.fillStyle = 'rgba(10,12,28,0.72)';
  ctx.fillRect(0, 0, VIEW_W, rows * (PH + 4) + 6);
  list.forEach((f, i) => {
    const x = 6 + (i % 4) * (PW + 4), y = 4 + ((i / 4) | 0) * (PH + 4);
    ctx.fillStyle = 'rgba(30,34,64,0.9)';
    ctx.fillRect(x, y, PW, PH);
    const tc = f.player >= 0 ? PLAYER_COLORS[f.player] : f.team <= 4 ? TEAM_COLORS[f.team] : f.boss ? '#ffd84a' : '#8f93a8';
    ctx.fillStyle = tc;
    ctx.fillRect(x, y, 3, PH);
    ctx.drawImage(portrait(f.key, 34), x + 6, y + 3);
    const label = f.player >= 0 ? `${f.player + 1}P` : f.boss ? 'CHEFE' : 'COM';
    txt(ctx, f.name.toUpperCase(), x + 46, y + 13, { size: 12, weight: 700, color: '#eef0ff' });
    txt(ctx, label, x + PW - 6, y + 13, { size: 11, weight: 700, color: tc, align: 'right' });
    const bw = PW - 52;
    ctx.fillStyle = '#3a0f14'; ctx.fillRect(x + 46, y + 17, bw, 10);
    const hp = Math.max(0, f.hp / f.maxHp);
    ctx.fillStyle = hp > 0.3 ? '#e8414a' : (w.frame % 20 < 10 ? '#ff7a5a' : '#e8414a');
    ctx.fillRect(x + 46, y + 17, bw * hp, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x + 46, y + 17, bw * hp, 3);
    ctx.fillStyle = '#0d1a3a'; ctx.fillRect(x + 46, y + 30, bw, 6);
    ctx.fillStyle = '#3e8ef0'; ctx.fillRect(x + 46, y + 30, bw * (f.mp / f.maxMp), 6);
    if (f.dead) {
      ctx.fillStyle = 'rgba(10,10,20,0.6)'; ctx.fillRect(x, y, PW, PH);
      txt(ctx, 'K.O.', x + PW / 2, y + 28, { size: 18, font: FONT_DISPLAY, align: 'center', color: '#ffd84a' });
    }
  });
}

function drawBanner(ctx, b) {
  const k = b.t / b.life;
  const slide = b.t < 10 ? (1 - b.t / 10) * 300 : 0;
  const alpha = k > 0.85 ? (1 - k) / 0.15 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(10,12,28,0.6)';
  ctx.fillRect(0, 205, VIEW_W, b.sub ? 100 : 76);
  txt(ctx, b.title, VIEW_W / 2 + slide, 262, { size: 46, font: FONT_DISPLAY, align: 'center', color: b.color, stroke: '#14121c', strokeW: 7 });
  if (b.sub) txt(ctx, b.sub, VIEW_W / 2 - slide, 292, { size: 20, weight: 700, align: 'center', color: '#eef0ff' });
  ctx.restore();
}

function drawPause(ctx, w) {
  ctx.fillStyle = 'rgba(8,10,24,0.72)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

// ---- modos de jogo ----

function teamLabel(fs) {
  const f = fs[0];
  if (fs.length === 1) return f.player >= 0 ? `${f.player + 1}P VENCEU!` : `${f.name.toUpperCase()} VENCEU!`;
  if (f.team <= 4) return `${TEAM_NAMES[f.team].toUpperCase()} VENCEU!`;
  return 'VITÓRIA!';
}

class VSMode {
  constructor(setup, onEnd) {
    this.setup = setup; this.onEnd = onEnd;
    this.done = false; this.endT = 0;
  }

  init(w) {
    this.setup.forEach((s, i) => {
      const left = i % 2 === 0;
      const x = left ? 220 + (i >> 1) * 90 : w.stageW - 220 - (i >> 1) * 90;
      const z = 30 + ((i * 61) % (DEPTH - 60));
      w.addFighter(s.key, { team: s.team, player: s.player, ai: s.ai, x, z, facing: left ? 1 : -1, name: s.name });
    });
    if (!w.demo) { w.setBanner('LUTEM!', '', 80); Sound.play('go'); }
  }

  update(w) {
    if (this.done) {
      if (++this.endT === 210) this.onEnd(w, this.result);
      return;
    }
    const alive = w.fighters.filter((f) => !f.dead);
    const teams = new Set(alive.map((f) => f.team));
    if (teams.size > 1) return;
    this.done = true;
    w.over = true;
    alive.forEach((f) => { f.victory = true; });
    const humanWon = alive.some((f) => f.player >= 0);
    const anyHuman = w.fighters.some((f) => f.player >= 0);
    const title = alive.length ? teamLabel(alive) : 'EMPATE';
    if (!w.demo) {
      w.setBanner(title, '', 200);
      Sound.play(!anyHuman || humanWon ? 'win' : 'lose');
    }
    this.result = { mode: 'vs', title, winners: alive, fighters: w.fighters.slice() };
  }
}

const SEG_W = 1150;

class StoryMode {
  constructor(humans, diff) {
    this.humans = humans; this.diff = diff;
    this.stageIdx = 0; this.over = false; this.overT = 0; this.cleared = false; this.clearT = 0;
  }

  init(w) {
    this.w = w;
    this.heroes = this.humans.map((h, i) => w.addFighter(h.key, { team: 1, player: h.player, x: 140, z: 70 + i * 60, facing: 1 }));
    this.loadStage(0);
  }

  loadStage(i) {
    const w = this.w, st = STORY[i];
    this.stageIdx = i; this.cleared = false; this.clearT = 0;
    w.bg = BACKGROUNDS[st.bg];
    w.stageW = st.phases.length * SEG_W;
    w.fighters = w.fighters.filter((f) => f.team === 1);
    w.projectiles = []; w.items = []; w.particles = [];
    this.heroes.forEach((f, k) => {
      if (f.dead) { f.dead = false; f.hp = Math.round(f.maxHp * 0.4); }
      else if (i > 0) f.hp = Math.min(f.maxHp, f.hp + Math.round(f.maxHp * 0.4));
      f.mp = Math.max(f.mp, 50);
      f.x = 140 + k * 40; f.z = 70 + k * 60; f.y = 0; f.vx = f.vy = f.vz = 0;
      f.facing = 1; f.holding = null; f.burn = 0; f.shock = 0;
      f.setState('idle');
      f.invuln = 60;
    });
    this.startPhase(0);
    w.cam.x = 0;
    w.setBanner(`FASE ${i + 1}`, st.name, 150);
    Sound.play('go');
  }

  startPhase(p) {
    const w = this.w;
    this.phase = p;
    this.queue = STORY[this.stageIdx].phases[p].slice();
    this.locked = true; this.goArrow = false; this.spawnT = 40;
    const s = p * SEG_W;
    w.camMin = s; w.camMax = s + SEG_W - VIEW_W;
    w.bounds = { min: s + 20, max: s + SEG_W - 20 };
    if (Math.random() < 0.7) w.randomItem();
  }

  aiLevel(boss) {
    return clamp(this.diff + (boss ? 0 : -1) + Math.floor(this.stageIdx / 2), 0, 2);
  }

  spawnEnemy(spec) {
    const w = this.w;
    const boss = spec[0] === '!';
    const key = boss ? spec.slice(1) : spec;
    const fromLeft = this.phase > 0 && Math.random() < 0.35;
    const x = fromLeft ? w.cam.x - 50 : w.cam.x + VIEW_W + 50;
    const f = w.addFighter(key, {
      team: 9, ai: this.aiLevel(boss), x, z: rand(10, DEPTH - 10), facing: fromLeft ? 1 : -1,
      boss, fades: true, hpMul: boss ? 1.25 + this.diff * 0.15 : 0.85 + this.diff * 0.15, mp: boss ? 80 : 30,
    });
    f.entering = true;
    if (boss) w.setBanner(`CHEFE: ${f.name.toUpperCase()}`, CHARACTERS[key].title, 110, '#ff8a5a');
  }

  update(w) {
    const heroesAlive = this.heroes.filter((f) => !f.dead);
    if (this.over) {
      if (++this.overT === 220) Game.finishBattle(w, this.result());
      return;
    }
    if (!heroesAlive.length) {
      this.over = true; w.over = true;
      w.setBanner('GAME OVER', STORY[this.stageIdx].name, 220, '#ff5a4e');
      Sound.play('lose');
      return;
    }
    for (const e of w.fighters) if (e.team !== 1 && e.dead && e.deadT > 100) e.gone = true;

    if (this.cleared) {
      if (++this.clearT === 210) {
        if (this.stageIdx + 1 < STORY.length) this.loadStage(this.stageIdx + 1);
        else {
          this.over = true; this.won = true; this.overT = 100; w.over = true;
          this.heroes.forEach((f) => { if (!f.dead) f.victory = true; });
          w.setBanner('CAMPANHA CONCLUÍDA!', 'Você derrotou todos os chefes', 220);
          Sound.play('win');
        }
      }
      return;
    }

    const enemies = w.fighters.filter((f) => f.team !== 1 && !f.dead);
    if (this.locked) {
      if (this.queue.length && enemies.length < 4 && --this.spawnT <= 0) {
        this.spawnEnemy(this.queue.shift());
        this.spawnT = 55;
      }
      if (!this.queue.length && !enemies.length) {
        if (this.phase === STORY[this.stageIdx].phases.length - 1) {
          this.cleared = true;
          w.setBanner('FASE CONCLUÍDA!', '', 200);
          Sound.play('win');
        } else {
          this.locked = false; this.goArrow = true;
          const next = (this.phase + 2) * SEG_W;
          w.bounds.max = next - 20; w.camMax = next - VIEW_W;
          Sound.play('go');
        }
      }
    } else if (heroesAlive.some((f) => f.x > (this.phase + 1) * SEG_W + 140)) {
      this.startPhase(this.phase + 1);
    }
  }

  result() {
    return {
      mode: 'story', fighters: this.heroes,
      title: this.won ? 'CAMPANHA CONCLUÍDA!' : 'GAME OVER',
      sub: this.won ? 'Todas as 5 fases vencidas' : `Chegou até a fase ${this.stageIdx + 1}: ${STORY[this.stageIdx].name}`,
      won: !!this.won,
    };
  }

  drawOverlay(ctx, w) {
    txt(ctx, `FASE ${this.stageIdx + 1} · ${STORY[this.stageIdx].name}`, 12, VIEW_H - 12, { size: 14, weight: 700, color: '#ffffff', stroke: '#14121c', strokeW: 3 });
    if (this.goArrow && w.frame % 40 < 26) {
      txt(ctx, 'AVANCE ➜', VIEW_W - 24, 250, { size: 34, font: FONT_DISPLAY, align: 'right', color: '#ffd84a', stroke: '#14121c', strokeW: 6 });
    }
  }
}

class SurvivalMode {
  constructor(humans, diff) {
    this.humans = humans; this.diff = diff;
    this.wave = 0; this.next = 90; this.queue = []; this.over = false; this.overT = 0; this.spawnT = 0;
  }

  init(w) {
    this.w = w;
    this.heroes = this.humans.map((h, i) => w.addFighter(h.key, { team: 1, player: h.player, x: w.stageW / 2 - 40 + i * 80, z: 80 + i * 40, facing: 1 }));
  }

  startWave() {
    const w = this.w, n = ++this.wave;
    const q = [];
    const count = 1 + Math.ceil(n * 0.9);
    for (let i = 0; i < count; i++) q.push(i < Math.floor(n / 3) ? 'brute' : 'bandit');
    if (n % 5 === 0) q.push('!' + choice(PLAYABLE));
    this.queue = q.sort(() => Math.random() - 0.5);
    this.spawnT = 20;
    this.heroes.forEach((f) => { if (!f.dead) f.hp = Math.min(f.maxHp, f.hp + Math.round(f.maxHp * 0.12)); });
    w.setBanner(`ONDA ${n}`, n % 5 === 0 ? 'Um chefe se aproxima!' : '', 100);
    Sound.play('go');
    if (Math.random() < 0.6) w.randomItem();
  }

  update(w) {
    if (this.over) {
      if (++this.overT === 220) Game.finishBattle(w, this.result());
      return;
    }
    if (!this.heroes.some((f) => !f.dead)) {
      this.over = true; w.over = true;
      w.setBanner('FIM DE JOGO', `Você sobreviveu a ${this.wave - 1} onda(s)`, 220, '#ff5a4e');
      Sound.play('lose');
      return;
    }
    for (const e of w.fighters) if (e.team !== 1 && e.dead && e.deadT > 100) e.gone = true;
    const enemies = w.fighters.filter((f) => f.team !== 1 && !f.dead);
    if (!this.queue.length && !enemies.length) {
      if (--this.next <= 0) { this.startWave(); this.next = 120; }
      return;
    }
    if (this.queue.length && enemies.length < 5 && --this.spawnT <= 0) {
      const spec = this.queue.shift(), boss = spec[0] === '!', key = boss ? spec.slice(1) : spec;
      const fromLeft = Math.random() < 0.5;
      const lvl = clamp(this.diff - 1 + Math.floor((this.wave - 1) / 4), 0, 2);
      const f = w.addFighter(key, {
        team: 9, ai: lvl, x: fromLeft ? w.cam.x - 50 : w.cam.x + VIEW_W + 50, z: rand(10, DEPTH - 10),
        facing: fromLeft ? 1 : -1, boss, fades: true, hpMul: boss ? 1.2 : 0.8 + Math.min(this.wave, 15) * 0.04,
      });
      f.entering = true;
      this.spawnT = 45;
    }
  }

  result() {
    return {
      mode: 'survival', fighters: this.heroes, title: 'FIM DE JOGO',
      sub: `Ondas vencidas: ${Math.max(0, this.wave - 1)}`, won: false,
    };
  }

  drawOverlay(ctx) {
    txt(ctx, `ONDA ${this.wave}`, 12, VIEW_H - 12, { size: 16, font: FONT_DISPLAY, color: '#ffd84a', stroke: '#14121c', strokeW: 4 });
  }
}

function wrapText(ctx, s, x, y, maxW, lineH, o) {
  ctx.font = `${o.weight || ''} ${o.size || 16}px ${o.font || FONT_UI}`;
  const words = s.split(' ');
  let line = '';
  for (const wd of words) {
    const test = line ? line + ' ' + wd : wd;
    if (ctx.measureText(test).width > maxW && line) {
      txt(ctx, line, x, y, o);
      line = wd; y += lineH;
    } else line = test;
  }
  if (line) txt(ctx, line, x, y, o);
  return y + lineH;
}

function drawLogo(ctx, cx, y, scale = 1) {
  ctx.save();
  ctx.translate(cx, y);
  ctx.scale(scale, scale);
  ctx.rotate(-0.04);
  txt(ctx, 'MUGEN', 6, 6, { size: 92, font: FONT_DISPLAY, align: 'center', color: '#b8261e' });
  txt(ctx, 'MUGEN', 0, 0, { size: 92, font: FONT_DISPLAY, align: 'center', color: '#f4f1ff', stroke: '#14121c', strokeW: 10 });
  txt(ctx, 'BRAWL', 64, 66, { size: 58, font: FONT_DISPLAY, align: 'center', color: '#14121c', stroke: '#14121c', strokeW: 12 });
  txt(ctx, 'BRAWL', 60, 62, { size: 58, font: FONT_DISPLAY, align: 'center', color: '#ffb000' });
  ctx.restore();
}

function stripedBackdrop(ctx, t, tint) {
  ctx.fillStyle = '#0f1124';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = tint;
  for (let i = -10; i < 30; i++) {
    const x = i * 60 + (t * 0.4) % 60;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 26, 0); ctx.lineTo(x - 154, VIEW_H); ctx.lineTo(x - 180, VIEW_H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

const ROSTER = [...PLAYABLE, 'random'];
const MODE_NAMES = { vs: 'MODO VS', story: 'MODO HISTÓRIA', survival: 'SOBREVIVÊNCIA' };

class SelectScreen {
  constructor(mode) {
    this.mode = mode; this.t = 0; this.phase = 'pick'; this.cfgSel = 0; this.warn = '';
    const prev = Game.lastPicks;
    this.slots = [0, 1].map((p) => ({
      player: p,
      state: p === 0 ? 'char' : (prev && prev[1].joined ? 'char' : 'off'),
      cur: prev ? prev[p].cur : p,
      team: prev ? prev[p].team : 0,
      anim: 0,
    }));
  }

  active() { return this.slots.filter((s) => s.state !== 'off'); }

  update() {
    this.t++;
    for (const s of this.slots) s.anim++;
    if (this.phase === 'pick') this.updatePick();
    else this.updateConfig();
  }

  updatePick() {
    const N = ROSTER.length;
    for (const s of this.slots) {
      const P = (a) => menuPressed(s.player, a);
      if (s.state === 'off') {
        if (P('attack')) { s.state = 'char'; Sound.play('select'); }
        continue;
      }
      const back = P('defend') || P('jump');
      if (s.state === 'char') {
        if (P('left')) { s.cur = (s.cur + N - 1) % N; Sound.play('menu'); s.anim = 0; }
        if (P('right')) { s.cur = (s.cur + 1) % N; Sound.play('menu'); s.anim = 0; }
        if (P('attack')) { s.state = this.mode === 'vs' ? 'team' : 'ready'; Sound.play('select'); }
        else if (back) {
          Sound.play('back');
          if (s.player === 0) { Game.toTitle(); return; }
          s.state = 'off';
        }
      } else if (s.state === 'team') {
        if (P('left')) { s.team = (s.team + 4) % 5; Sound.play('menu'); }
        if (P('right')) { s.team = (s.team + 1) % 5; Sound.play('menu'); }
        if (P('attack')) { s.state = 'ready'; Sound.play('select'); }
        else if (back) { s.state = 'char'; Sound.play('back'); }
      } else if (s.state === 'ready' && back) {
        s.state = this.mode === 'vs' ? 'team' : 'char';
        Sound.play('back');
      }
    }
    const act = this.active();
    if (act.length && act.every((s) => s.state === 'ready')) {
      this.phase = 'config'; this.cfgSel = 0; this.warn = '';
    }
  }

  configItems() {
    const st = Game.settings;
    const diff = { label: 'Dificuldade', value: AI_LEVELS[st.diff].name, change: (d) => { st.diff = clamp(st.diff + d, 0, 2); } };
    if (this.mode !== 'vs') return [diff, { label: 'COMEÇAR!', go: true }];
    const humans = this.active().length;
    st.cpus = clamp(st.cpus, 0, 8 - humans);
    return [
      { label: 'Computadores', value: String(st.cpus), change: (d) => { st.cpus = clamp(st.cpus + d, 0, 8 - humans); } },
      { label: 'Time dos computadores', value: st.cpuTeam ? TEAM_NAMES[st.cpuTeam] : 'Cada um por si', change: (d) => { st.cpuTeam = (st.cpuTeam + d + 5) % 5; } },
      diff,
      { label: 'Cenário', value: st.bg < 0 ? 'Aleatório' : BACKGROUNDS[BG_KEYS[st.bg]].name, change: (d) => { st.bg = ((st.bg + 1 + d + BG_KEYS.length + 1) % (BG_KEYS.length + 1)) - 1; } },
      { label: 'LUTAR!', go: true },
    ];
  }

  updateConfig() {
    const items = this.configItems(), n = items.length;
    const any = (a) => menuPressed(0, a) || menuPressed(1, a);
    if (any('up')) { this.cfgSel = (this.cfgSel + n - 1) % n; Sound.play('menu'); }
    if (any('down')) { this.cfgSel = (this.cfgSel + 1) % n; Sound.play('menu'); }
    const it = items[this.cfgSel];
    if (it.change) {
      if (any('left')) { it.change(-1); Sound.play('menu'); this.warn = ''; }
      if (any('right')) { it.change(1); Sound.play('menu'); this.warn = ''; }
    }
    if (any('attack') && it.go) this.start();
    else if (any('defend') || any('jump')) {
      Sound.play('back');
      this.phase = 'pick';
      for (const s of this.active()) s.state = this.mode === 'vs' ? 'team' : 'char';
    }
  }

  start() {
    const st = Game.settings;
    const act = this.active();
    Game.lastPicks = this.slots.map((s) => ({ cur: s.cur, team: s.team, joined: s.state !== 'off' }));
    const pickKey = (s) => (ROSTER[s.cur] === 'random' ? choice(PLAYABLE) : ROSTER[s.cur]);
    const humans = act.map((s) => ({ key: pickKey(s), player: s.player, team: s.team || undefined }));
    Sound.play('go');
    if (this.mode === 'vs') {
      const all = humans.slice();
      for (let i = 0; i < st.cpus; i++) all.push({ key: choice(PLAYABLE), ai: st.diff, team: st.cpuTeam || undefined });
      const teams = new Set(all.map((f, i) => f.team || 'solo' + i));
      if (all.length < 2 || teams.size < 2) {
        this.warn = 'Precisa de pelo menos dois lados na luta: adicione computadores ou mude os times.';
        Sound.play('back');
        return;
      }
      // humanos e CPUs alternam lados da arena
      const order = [];
      const cpus = all.slice(humans.length);
      for (let i = 0; i < Math.max(humans.length, cpus.length); i++) {
        if (humans[i]) order.push(humans[i]);
        if (cpus[i]) order.push(cpus[i]);
      }
      const bg = st.bg < 0 ? choice(BG_KEYS) : BG_KEYS[st.bg];
      Game.startWorld(new VSMode(order, (w, r) => Game.finishBattle(w, r)), { bg, stageW: 1400 });
    } else if (this.mode === 'story') {
      Game.startWorld(new StoryMode(humans, st.diff), { bg: STORY[0].bg, stageW: SEG_W * 3 });
    } else {
      Game.startWorld(new SurvivalMode(humans, st.diff), { bg: choice(BG_KEYS), stageW: 1400 });
    }
  }

  draw(ctx) {
    stripedBackdrop(ctx, this.t, '#5a7bff');
    txt(ctx, 'ESCOLHA SEU LUTADOR', 30, 52, { size: 32, font: FONT_DISPLAY, color: '#ffffff' });
    txt(ctx, MODE_NAMES[this.mode], VIEW_W - 30, 52, { size: 18, font: FONT_DISPLAY, align: 'right', color: '#ffb000' });

    const CW = 118, GAP = 12, x0 = (VIEW_W - (ROSTER.length * CW + (ROSTER.length - 1) * GAP)) / 2, cy = 72, CH = 150;
    ROSTER.forEach((key, i) => {
      const x = x0 + i * (CW + GAP);
      const grd = ctx.createLinearGradient(0, cy, 0, cy + CH);
      if (key === 'random') {
        grd.addColorStop(0, '#3a3f6e'); grd.addColorStop(1, '#1a1c38');
      } else {
        const look = prepLook(CHARACTERS[key].look);
        grd.addColorStop(0, shade(look.shirt, 0.25)); grd.addColorStop(1, shade(look.shirt, -0.6));
      }
      ctx.fillStyle = grd;
      ctx.fillRect(x, cy, CW, CH);
      ctx.save();
      ctx.beginPath(); ctx.rect(x, cy, CW, CH); ctx.clip();
      if (key === 'random') {
        txt(ctx, '?', x + CW / 2, cy + 105, { size: 84, font: FONT_DISPLAY, align: 'center', color: '#c9cbe8' });
      } else {
        drawFigure(ctx, x + CW / 2, cy + CH - 14, 1, idlePose(this.t + i * 20), CHARACTERS[key].look, 1.32 * (CHARACTERS[key].size || 1));
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(10,12,28,0.75)';
      ctx.fillRect(x, cy + CH - 24, CW, 24);
      txt(ctx, key === 'random' ? 'ALEATÓRIO' : CHARACTERS[key].name.toUpperCase(), x + CW / 2, cy + CH - 7, { size: 14, font: FONT_DISPLAY, align: 'center', color: '#ffffff' });
      // cursores dos jogadores
      this.slots.forEach((s) => {
        if (s.state === 'off' || s.cur !== i) return;
        const c = PLAYER_COLORS[s.player], inset = s.player * 4;
        ctx.strokeStyle = c; ctx.lineWidth = 4;
        ctx.strokeRect(x + 2 + inset, cy + 2 + inset, CW - 4 - inset * 2, CH - 4 - inset * 2);
        ctx.fillStyle = c;
        ctx.fillRect(x + (s.player ? CW - 34 : 0), cy - 16, 34, 16);
        txt(ctx, `${s.player + 1}P`, x + (s.player ? CW - 17 : 17), cy - 3, { size: 12, font: FONT_DISPLAY, align: 'center', color: '#14121c' });
      });
    });

    this.slots.forEach((s, i) => this.drawSlot(ctx, s, 30 + i * 460, 244, 440, 284));
    if (this.phase === 'config') this.drawConfig(ctx);
  }

  drawSlot(ctx, s, x, y, w, h) {
    const c = PLAYER_COLORS[s.player];
    ctx.fillStyle = 'rgba(20,23,48,0.92)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, 4);
    if (s.state === 'off') {
      txt(ctx, `${s.player + 1}P`, x + w / 2, y + 120, { size: 48, font: FONT_DISPLAY, align: 'center', color: c });
      const blink = this.t % 60 < 40;
      if (blink) txt(ctx, 'Pressione ATAQUE para entrar', x + w / 2, y + 160, { size: 18, weight: 700, align: 'center', color: '#ffffff' });
      txt(ctx, s.player === 1 ? 'Num 1 ou vírgula' : 'J ou Enter', x + w / 2, y + 186, { size: 14, align: 'center', color: '#8f93b8' });
      return;
    }
    const key = ROSTER[s.cur];
    const ready = s.state === 'ready';
    if (key === 'random') {
      txt(ctx, '?', x + 80, y + 210, { size: 120, font: FONT_DISPLAY, align: 'center', color: '#5a5f8e' });
      txt(ctx, 'ALEATÓRIO', x + 170, y + 50, { size: 26, font: FONT_DISPLAY, color: '#ffffff' });
      wrapText(ctx, 'Um lutador surpresa é sorteado quando a luta começa.', x + 170, y + 80, w - 186, 20, { size: 15, color: '#c9cbe8' });
    } else {
      const d = CHARACTERS[key];
      const pose = ready ? POSES.victory : (s.anim < 20 ? keyPose([[0, 'punchWind'], [6, 'punchHit'], [20, 'guard']], s.anim) : idlePose(this.t));
      drawFigure(ctx, x + 82, y + h - 30, 1, pose, d.look, 2.2 * (d.size || 1));
      txt(ctx, d.name.toUpperCase(), x + 170, y + 46, { size: 28, font: FONT_DISPLAY, color: '#ffffff' });
      txt(ctx, d.title, x + 170, y + 68, { size: 15, weight: 700, color: c });
      let yy = wrapText(ctx, d.desc, x + 170, y + 92, w - 186, 18, { size: 14, color: '#c9cbe8' });
      const stats = [['Vida', d.hp / 600], ['Força', d.power / 1.2], ['Velocidade', d.speed / 3.8]];
      stats.forEach(([n, v], k) => {
        const by = yy + k * 17;
        txt(ctx, n, x + 170, by + 9, { size: 12, color: '#8f93b8' });
        ctx.fillStyle = '#2a2e58'; ctx.fillRect(x + 250, by, 160, 9);
        ctx.fillStyle = '#ffb000'; ctx.fillRect(x + 250, by, 160 * clamp(v, 0, 1), 9);
      });
      yy += 58;
      Object.entries(d.specials).forEach(([k, m], j) => {
        txt(ctx, specialLabel(k), x + 170, yy + j * 19, { size: 14, weight: 700, color: '#ffffff' });
        txt(ctx, `${m.name} · ${m.cost} MP`, x + 230, yy + j * 19, { size: 14, color: '#c9cbe8' });
      });
    }
    if (this.mode === 'vs') {
      const choosing = s.state === 'team';
      const label = (choosing ? '◀ ' : '') + TEAM_NAMES[s.team] + (choosing ? ' ▶' : '');
      txt(ctx, label, x + w - 14, y + 26, { size: 15, weight: 700, align: 'right', color: choosing && this.t % 40 < 26 ? '#ffffff' : TEAM_COLORS[s.team] });
    }
    if (ready) {
      ctx.save();
      ctx.translate(x + 82, y + 60);
      ctx.rotate(-0.12);
      txt(ctx, 'PRONTO!', 0, 0, { size: 26, font: FONT_DISPLAY, align: 'center', color: '#ffb000', stroke: '#14121c', strokeW: 6 });
      ctx.restore();
    } else {
      const hint = s.state === 'team' ? '←/→ escolhe o time · ATAQUE confirma' : '←/→ escolhe · ATAQUE confirma';
      txt(ctx, hint, x + 14, y + h - 10, { size: 12, color: '#8f93b8' });
    }
  }

  drawConfig(ctx) {
    ctx.fillStyle = 'rgba(8,10,24,0.78)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    const items = this.configItems();
    const w = 560, h = 90 + items.length * 44 + (this.warn ? 30 : 0), x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
    ctx.fillStyle = '#171b38';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ffb000';
    ctx.fillRect(x, y, w, 4);
    txt(ctx, 'AJUSTES DA PARTIDA', x + 24, y + 44, { size: 22, font: FONT_DISPLAY, color: '#ffffff' });
    items.forEach((it, i) => {
      const yy = y + 90 + i * 44, sel = i === this.cfgSel;
      if (sel) { ctx.fillStyle = 'rgba(255,176,0,0.16)'; ctx.fillRect(x + 12, yy - 28, w - 24, 38); }
      if (it.go) {
        txt(ctx, it.label, x + w / 2, yy, { size: 22, font: FONT_DISPLAY, align: 'center', color: sel ? '#ffb000' : '#ffffff' });
      } else {
        txt(ctx, it.label, x + 28, yy, { size: 18, weight: 700, color: sel ? '#ffffff' : '#c9cbe8' });
        txt(ctx, (sel ? '◀  ' : '') + it.value + (sel ? '  ▶' : ''), x + w - 28, yy, { size: 18, weight: 700, align: 'right', color: sel ? '#ffb000' : '#ffffff' });
      }
    });
    if (this.warn) wrapText(ctx, this.warn, x + 28, y + h - 30, w - 56, 18, { size: 14, color: '#ff8a7a' });
  }
}

// ---- resultados ----

class ResultsScreen {
  constructor(r) {
    this.r = r; this.t = 0;
    const f = r.fighters.slice();
    f.sort((a, b) => (b.player >= 0) - (a.player >= 0) || (a.dead - b.dead) || b.stats.dmg - a.stats.dmg);
    this.rows = f.slice(0, 8);
  }

  update() {
    this.t++;
    if (this.t > 30 && (anyMenu('attack') || anyMenu('defend'))) {
      Sound.play('select');
      if (this.r.mode === 'vs' && anyMenu('attack')) Game.setScreen(new SelectScreen('vs'));
      else Game.toTitle();
    }
  }

  draw(ctx) {
    stripedBackdrop(ctx, this.t, '#ffb000');
    txt(ctx, this.r.title, VIEW_W / 2, 70, { size: 40, font: FONT_DISPLAY, align: 'center', color: '#ffb000', stroke: '#14121c', strokeW: 6 });
    if (this.r.sub) txt(ctx, this.r.sub, VIEW_W / 2, 102, { size: 18, weight: 700, align: 'center', color: '#c9cbe8' });
    const cols = [['LUTADOR', 90, 'left'], ['DANO CAUSADO', 520, 'right'], ['NOCAUTES', 640, 'right'], ['DANO SOFRIDO', 790, 'right'], ['SITUAÇÃO', 900, 'right']];
    cols.forEach(([n, x, a]) => txt(ctx, n, x, 140, { size: 12, weight: 700, align: a, color: '#8f93b8' }));
    this.rows.forEach((f, i) => {
      const y = 152 + i * 44;
      ctx.fillStyle = i % 2 ? 'rgba(30,34,64,0.7)' : 'rgba(22,25,50,0.7)';
      ctx.fillRect(40, y, 880, 40);
      ctx.drawImage(portrait(f.key, 34), 46, y + 3);
      const label = f.player >= 0 ? `${f.player + 1}P` : f.boss ? 'CHEFE' : 'COM';
      const lc = f.player >= 0 ? PLAYER_COLORS[f.player] : '#8f93b8';
      txt(ctx, f.name, 90, y + 26, { size: 18, weight: 700, color: '#ffffff' });
      txt(ctx, label, 90 + ctx.measureText(f.name).width + 10, y + 26, { size: 13, weight: 700, color: lc });
      const win = this.r.winners ? this.r.winners.includes(f) : !f.dead;
      const vals = [String(f.stats.dmg), String(f.stats.kills), String(f.stats.taken)];
      vals.forEach((v, k) => txt(ctx, v, cols[k + 1][1], y + 26, { size: 18, weight: 700, align: 'right', color: '#e9ebff' }));
      txt(ctx, win ? (this.r.winners ? 'VENCEU' : 'DE PÉ') : 'K.O.', 900, y + 26, { size: 15, font: FONT_DISPLAY, align: 'right', color: win ? '#66d17a' : '#ff6b5e' });
    });
    const msg = this.r.mode === 'vs' ? 'ATAQUE: nova luta · DEFESA: menu principal' : 'Pressione ATAQUE para voltar ao menu';
    if (this.t > 30) txt(ctx, msg, VIEW_W / 2, VIEW_H - 22, { size: 16, weight: 700, align: 'center', color: '#ffffff' });
  }
}

// ---- js/main.js ----
'use strict';
// Laço principal com passo fixo de 60 quadros por segundo.

(function boot() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  Keys.init();
  setupTouch();
  canvas.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); });
  Game.init(ctx);

  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 250);
    last = now;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      Game.update();
      Keys.endFrame();
      acc -= STEP;
      steps++;
    }
    Game.draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1030">
<title>Punho Livre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="wrap">
  <canvas id="game" width="794" height="470" aria-label="Punho Livre"></canvas>
  <div id="touch" hidden>
    <div class="dpad" aria-label="Direcional">
      <span class="arrow up">▲</span><span class="arrow left">◀</span>
      <span class="arrow right">▶</span><span class="arrow down">▼</span>
      <span class="knob"></span>
    </div>
    <div class="sys">
      <button type="button" data-key="Escape" aria-label="Voltar ou sair da luta">Esc</button>
      <button type="button" data-key="F1" aria-label="Pausa">II</button>
    </div>
    <div class="specials" hidden aria-label="Golpes especiais"></div>
    <div class="btns">
      <button type="button" data-key="T_def" class="d" aria-label="Defesa">D</button>
      <button type="button" data-key="T_jump" class="j" aria-label="Pulo">J</button>
      <button type="button" data-key="T_att" class="a" aria-label="Ataque">A</button>
    </div>
  </div>
</main>

<form id="netform" hidden autocomplete="off">
  <h2>Jogar em rede</h2>
  <label for="net-server">Servidor</label>
  <input id="net-server" type="text" inputmode="url" placeholder="ex.: punholivre.onrender.com" spellcheck="false">
  <label for="net-name">Seu nome</label>
  <input id="net-name" type="text" maxlength="10" placeholder="Jogador">
  <div class="row">
    <button type="button" id="net-create">Criar sala</button>
  </div>
  <label for="net-code">Código da sala</label>
  <div class="row">
    <input id="net-code" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" spellcheck="false">
    <button type="button" id="net-join">Entrar</button>
  </div>
  <p id="net-status" role="status"></p>
  <button type="button" id="net-back" class="secondary">Voltar</button>
</form>

<script src="src/core/global.js"></script>
<script src="src/core/save.js"></script>
<script src="src/ui/logo.js"></script>
<script src="src/content/painter.js"></script>
<script src="src/content/moves.js"></script>
<script src="src/content/roster.js"></script>
<script src="src/content/scenes.js"></script>
<script src="src/content/build.js"></script>
<script src="src/core/assets.js"></script>
<script src="src/audio/music.js"></script>
<script src="src/core/input.js"></script>
<script src="src/engine/object.js"></script>
<script src="src/engine/character.js"></script>
<script src="src/engine/weapon.js"></script>
<script src="src/engine/ball.js"></script>
<script src="src/engine/effects.js"></script>
<script src="src/engine/background.js"></script>
<script src="src/engine/ai.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/engine/match.js"></script>
<script src="src/engine/stage.js"></script>
<script src="src/ui/ui.js"></script>
<script src="src/ui/settings.js"></script>
<script src="src/net/net.js"></script>
<script src="src/core/main.js"></script>
</body>
</html>

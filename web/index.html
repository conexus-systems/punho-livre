<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1030">
<title>Punho Livre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="wrap">
  <canvas id="game" width="794" height="470" aria-label="Punho Livre"></canvas>
  <div id="touch" hidden>
    <div class="dpad" aria-label="Direcional">
      <span class="arrow up">▲</span><span class="arrow left">◀</span>
      <span class="arrow right">▶</span><span class="arrow down">▼</span>
      <span class="knob"></span>
    </div>
    <div class="sys">
      <button type="button" data-key="Escape" aria-label="Voltar ou sair da luta">Esc</button>
      <button type="button" data-key="F1" aria-label="Pausa">II</button>
    </div>
    <div class="specials" hidden aria-label="Golpes especiais"></div>
    <div class="btns">
      <button type="button" data-key="T_def" class="d" aria-label="Defesa">D</button>
      <button type="button" data-key="T_jump" class="j" aria-label="Pulo">J</button>
      <button type="button" data-key="T_att" class="a" aria-label="Ataque">A</button>
    </div>
  </div>
</main>

<form id="netform" hidden autocomplete="off">
  <h2>Jogar em rede</h2>
  <label for="net-server">Servidor</label>
  <input id="net-server" type="text" inputmode="url" placeholder="ex.: punholivre.onrender.com" spellcheck="false">
  <label for="net-name">Seu nome</label>
  <input id="net-name" type="text" maxlength="10" placeholder="Jogador">
  <div class="row">
    <button type="button" id="net-create">Criar sala</button>
  </div>
  <label for="net-code">Código da sala</label>
  <div class="row">
    <input id="net-code" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" spellcheck="false">
    <button type="button" id="net-join">Entrar</button>
  </div>
  <p id="net-status" role="status"></p>
  <button type="button" id="net-back" class="secondary">Voltar</button>
</form>

<!-- O jogo é Rust compilado para WebAssembly (ver rust/ e tools/build-wasm.sh).
     O .wasm vem em base64 (punho_wasm.js) para funcionar também aberto direto do disco e dentro do app. -->
<script src="pkg/punho.js"></script>
<script src="pkg/punho_wasm.js"></script>
<script>
(function () {
  function b64ToBytes(s) {
    var bin = atob(s), n = bin.length, out = new Uint8Array(n);
    for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fail(e) {
    var c = document.getElementById('game');
    var g = c.getContext('2d');
    g.fillStyle = '#0b1030'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#fff'; g.font = 'bold 18px Arial'; g.textAlign = 'center';
    g.fillText('Não foi possível iniciar o jogo.', c.width / 2, 200);
    g.font = '11px Arial'; g.fillStyle = '#afdcff';
    g.fillText(String(e && e.message || e), c.width / 2, 250, 740);
    console.error(e);
  }
  var fonts = document.fonts ? document.fonts.load('40px "Bangers"').catch(function () {}) : Promise.resolve();
  Promise.all([wasm_bindgen({ module_or_path: b64ToBytes(PUNHO_WASM_B64) }), fonts]).then(function () {
    window.PUNHO = wasm_bindgen;
    wasm_bindgen.start_game();
    // Botão voltar do app Android: fecha na tela inicial, senão age como Esc.
    window.androidBack = function () {
      if (wasm_bindgen.punho_android_back() && window.AndroidApp) window.AndroidApp.exit();
    };
  }).catch(fail);
})();
</script>
</body>
</html>

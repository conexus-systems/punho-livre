# Solid Queue — tabelas no banco primário (ADR 0001).
# JOB_THREADS / JOB_POLLING_INTERVAL vêm do secret do módulo rails-lke
# (platform-infra). Não use polling_interval < 1s: queima conexões do Postgres
# compartilhado. Um processo só (async dentro do Puma).
default: &default
  dispatchers:
    - polling_interval: <%= ENV.fetch("JOB_POLLING_INTERVAL", 1) %>
      batch_size: 500
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 2) %>
      processes: 1
      polling_interval: <%= ENV.fetch("JOB_POLLING_INTERVAL", 1) %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

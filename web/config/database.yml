# PostgreSQL — banco único.
#
# Padrão da frota CONEXUS: conexão por variáveis discretas DATABASE_HOST /
# DATABASE_NAME / DATABASE_USERNAME / DATABASE_PASSWORD / DATABASE_PORT
# (nunca DATABASE_URL). As tabelas do Solid Queue, Solid Cache e Solid Cable
# vivem neste mesmo banco (db/migrate), então não há conexões extras
# `queue`/`cache`/`cable` (ADR 0001; Postgres gerenciado compartilhado).
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "mugen_arena_development" } %>

# Teste: DATABASE_TEST_* com fallback para DATABASE_* (padrão frota).
test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_TEST_NAME") { "mugen_arena_test" } %>
  host: <%= ENV.fetch("DATABASE_TEST_HOST") { ENV.fetch("DATABASE_HOST") { "localhost" } } %>
  port: <%= ENV.fetch("DATABASE_TEST_PORT") { ENV.fetch("DATABASE_PORT") { 5432 } } %>
  username: <%= ENV.fetch("DATABASE_TEST_USERNAME") { ENV.fetch("DATABASE_USERNAME") { "postgres" } } %>
  password: <%= ENV.fetch("DATABASE_TEST_PASSWORD") { ENV.fetch("DATABASE_PASSWORD") { "postgres" } } %>

# Produção: secret K8s gerado pelo platform-infra. SSL do Postgres gerenciado
# vem via PGSSLMODE=require (libpq lê do ambiente).
# Condicional: evita KeyError ao renderizar o arquivo inteiro em CI/test.
production:
  <<: *default
<% unless ENV["DATABASE_HOST"].to_s.empty? %>
  database: <%= ENV.fetch("DATABASE_NAME") %>
  host: <%= ENV.fetch("DATABASE_HOST") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
  username: <%= ENV.fetch("DATABASE_USERNAME") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") %>
<% else %>
  database: mugen_arena_production
<% end %>
  # Postgres compartilhado da frota (max_connections 50): o módulo rails-lke
  # grava esses valores no secret; o fallback é o mesmo.
  idle_timeout: <%= ENV.fetch("DATABASE_IDLE_TIMEOUT", 60) %>
  reaping_frequency: <%= ENV.fetch("DATABASE_REAPING_FREQUENCY", 30) %>
  # Teto, não reserva. No modo Puma as threads de job usam o mesmo pool.
  # (`pool` do README do rails-lke; no Rails 8.1 a chave chama max_connections
  # e definir as duas com valores diferentes é erro.)
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 3).to_i + ENV.fetch("JOB_THREADS", 2).to_i %>

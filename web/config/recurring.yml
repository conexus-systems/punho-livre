# Tarefas recorrentes do Solid Queue.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_stale_matchmaking_tickets:
    class: MatchmakingCleanupJob
    schedule: every 5 minutes
  purge_old_telemetry:
    class: TelemetryPurgeJob
    schedule: every day at 4:17am

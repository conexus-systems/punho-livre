# Dependabot — CONEXUS canon (weekly America/Sao_Paulo).
version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 8
    labels: [dependencies, javascript]
    groups:
      expo:
        patterns: ["expo*", "@expo/*", "react-native*", "@react-native*", "react", "react-dom"]
  - package-ecosystem: bundler
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 8
    labels: [dependencies, ruby]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }

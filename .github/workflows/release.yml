name: Release

# Publica uma versão: crie e envie uma tag (git tag v3.0.0 && git push origin v3.0.0).
# O fluxo confere o jogo, gera o APK e o AAB e abre a release no GitHub com os dois arquivos.
# Para assinar com a sua chave (em vez da chave de teste), cadastre os segredos:
#   KEYSTORE_BASE64 (o .p12 em base64), KEYSTORE_PASS e KEY_ALIAS.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Versão a partir da tag
        id: ver
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          CODE="$(echo "$NAME" | awk -F. '{ printf "%d", $1*10000 + $2*100 + $3 }')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Chave de assinatura (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          else
            echo "Sem chave própria: o pacote sai assinado com a chave de teste (serve para instalar, não para a Play Store)."
          fi
      - name: APK e AAB
        run: FORMAT=both SKIP_WASM=1 VERSION_CODE=${{ steps.ver.outputs.code }} VERSION_NAME=${{ steps.ver.outputs.name }} ./android/build.sh
      - name: Notas da versão (do CHANGELOG.md)
        run: |
          awk -v v="${{ steps.ver.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Punho Livre ${{ steps.ver.outputs.name }}" > notas.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Punho Livre ${{ steps.ver.outputs.name }}
          body_path: notas.md
          files: |
            dist/punho-livre.apk
            dist/punho-livre.aab

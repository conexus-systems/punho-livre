name: CI

on:
  push:
    branches: [main, ccr-7b05c043-tpupcs, reorganizacao]
  pull_request:
  workflow_dispatch:

env:
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  testes:
    name: Rust, conferência e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: wasm-bindgen-cli (a versão tem que ser a mesma do Cargo.toml)
        id: wb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}
      - if: steps.wb.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: punho-livre-web
          path: web/pkg
          retention-days: 7

  android:
    name: APK e AAB
    runs-on: ubuntu-24.04
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: punho-livre-web
          path: web/pkg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (plataforma 36 e build-tools)
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gerar APK e AAB de teste (IDs de teste do AdMob, assinados com a chave de debug)
        run: ./android/gradlew -p android assembleRelease bundleRelease -PallowTestAds=true
      - uses: actions/upload-artifact@v4
        with:
          name: punho-livre-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

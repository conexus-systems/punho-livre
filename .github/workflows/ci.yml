# CI padronizado — chamado pelo Deploy — Production (main) via workflow_call.
# Disparo manual opcional (workflow_dispatch) só em main.
# A lógica vive em conexus-systems/platform-infra. Não copiar jobs para cá.
#
# Path-filter (recomendado nos callers dos apps):
#   paths: web/**, deploy/**, .github/workflows/ci.yml, deploy-production.yml
#   NÃO incluir mobile/** — CI mobile fica em mobile-ci.yml (ci-mobile.yml@v1);
#   build EAS em eas-build.yml.
#   MUGEN Arena: Rails em web/; este CI não tem gatilho de push/PR (fleet: testes
#   só no Deploy — Production). Se ligar push, use:
#     paths: ["web/**", "deploy/**", ".github/workflows/ci.yml",
#             ".github/workflows/deploy-production.yml"]
#
# working-directory passa para ci-rails.yml@v1.
#   "."  = Rails na raiz (BFF / legado / sem Expo)
#   "web" = produto Expo CONEXUS (Rails em web/)
name: CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Pasta do Rails no checkout. "." = raiz (legado/BFFs).
          Produto Expo CONEXUS = "web".
        type: string
        default: "web"
  workflow_dispatch:
    inputs:
      working-directory:
        description: Pasta do Rails no checkout (. ou web)
        type: string
        default: "web"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rails:
    name: CI
    uses: conexus-systems/platform-infra/.github/workflows/ci-rails.yml@v1
    with:
      working-directory: ${{ inputs.working-directory || '.' }}
      runner: conexus-lke-build
      with-vite: false
      with-brakeman: true
    secrets: inherit

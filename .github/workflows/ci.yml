name: CI

on:
  push:
    branches: [main, ccr-7b05c043-tpupcs, reorganizacao]
  pull_request:
  workflow_dispatch:

env:
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  testes:
    name: Rust, conferência e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: wasm-bindgen-cli (a versão tem que ser a mesma do Cargo.toml)
        id: wb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}
      - if: steps.wb.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Biblioteca de áudio do Linux (o app nativo usa o cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: App nativo sem janela (carrega o jogo, desenha o título e uma luta)
        run: cargo test --release --test native_headless
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: punho-livre-web
          path: web/pkg
          retention-days: 7

  android:
    name: APK e AAB
    runs-on: ubuntu-24.04
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (plataforma 36 e build-tools)
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: NDK do runner (ANDROID_NDK_LATEST_HOME) para o cargo-ndk
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: cargo-ndk (compila o Rust para cada ABI do Android)
        run: cargo install cargo-ndk --locked
      - name: Gerar APK e AAB de teste (IDs de teste do AdMob, assinados com a chave de debug)
        env:
          PUNHO_SERVER: ${{ vars.PUNHO_SERVER }}
        run: ./android/gradlew -p android assembleRelease bundleRelease -PallowTestAds=true
      - uses: actions/upload-artifact@v4
        with:
          name: punho-livre-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

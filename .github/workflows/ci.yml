name: CI

on:
  push:
    branches: [main, reorganizacao]
  pull_request:

jobs:
  testes:
    name: Conferência e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test

  android:
    name: APK e AAB
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gerar APK e AAB (assinados com a chave de teste)
        run: FORMAT=both ./android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: punho-livre-android
          path: |
            dist/punho-livre.apk
            dist/punho-livre.aab
